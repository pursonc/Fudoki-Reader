<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Fudoki Reader</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #172033;
      --border-color: #e5e7eb;
      --secondary-text: #64748b;
      --accent-color: #2563eb;
      --button-bg: #f8fafc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #18181b;
        --text-color: #f4f4f5;
        --border-color: #3f3f46;
        --secondary-text: #a1a1aa;
        --accent-color: #60a5fa;
        --button-bg: #27272a;
      }
    }
    body.theme-light {
      --bg-color: #ffffff;
      --text-color: #172033;
      --border-color: #e5e7eb;
      --secondary-text: #64748b;
      --accent-color: #2563eb;
      --button-bg: #f8fafc;
    }
    body.theme-dark {
      --bg-color: #18181b;
      --text-color: #f4f4f5;
      --border-color: #3f3f46;
      --secondary-text: #a1a1aa;
      --accent-color: #60a5fa;
      --button-bg: #27272a;
    }
    * {
      box-sizing: border-box;
    }
    body {
      width: 272px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      letter-spacing: 0;
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }
    .update-banner {
      margin-top: 10px;
      padding: 8px 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border: 1px solid var(--accent-color);
      border-radius: 6px;
      color: var(--text-color);
      font-size: 12px;
      line-height: 1.35;
    }
    .update-banner[hidden] {
      display: none;
    }
    .dismiss-btn {
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--secondary-text);
      font-size: 18px;
      line-height: 1;
    }
    h1 {
      margin: 0;
      font-size: 16px;
      line-height: 1.2;
    }
    .lang-flags {
      display: flex;
      gap: 6px;
      flex: 0 0 auto;
    }
    .lang-flag {
      width: 20px;
      height: 15px;
      border: 1px solid transparent;
      border-radius: 2px;
      opacity: 0.52;
      cursor: pointer;
    }
    .lang-flag.active {
      border-color: var(--text-color);
      opacity: 1;
    }
    .section {
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
      display: grid;
      gap: 10px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 30px;
    }
    label,
    .label {
      font-size: 13px;
      line-height: 1.3;
    }
    select,
    input[type="range"] {
      max-width: 128px;
    }
    select {
      min-height: 30px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--bg-color);
      color: var(--text-color);
      padding: 3px 6px;
      font: inherit;
      font-size: 12px;
    }
    input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: var(--accent-color);
    }
    button {
      font: inherit;
      cursor: pointer;
    }
    .plain-btn {
      min-height: 32px;
      width: 100%;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--button-bg);
      color: var(--text-color);
      font-size: 13px;
    }
    .plain-btn:hover {
      border-color: var(--accent-color);
    }
    .support-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
    }
    .support-grid .plain-btn {
      font-size: 12px;
      padding: 0 4px;
    }
    .note {
      color: var(--secondary-text);
      font-size: 11px;
      line-height: 1.4;
    }
    .footer {
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--secondary-text);
      font-size: 11px;
    }
    .link {
      color: var(--secondary-text);
      text-decoration: none;
    }
    .link:hover {
      color: var(--accent-color);
    }
  </style>
</head>
<body>
  <div class="header-row">
    <h1 data-i18n="settingsTitle">Fudoki Reader</h1>
    <div class="lang-flags" id="language-select">
      <img src="static/flags/en.svg" data-lang="en" class="lang-flag" title="English" alt="English">
      <img src="static/flags/zh.svg" data-lang="zh" class="lang-flag" title="中文" alt="中文">
      <img src="static/flags/ja.svg" data-lang="ja" class="lang-flag" title="日本語" alt="日本語">
    </div>
  </div>
  <div id="update-banner" class="update-banner" hidden>
    <span id="update-message"></span>
    <button id="dismiss-update" class="dismiss-btn" type="button" aria-label="关闭">×</button>
  </div>

  <div class="section">
    <button id="open-vocab" class="plain-btn" data-i18n="openVocab">生词本</button>
    <div class="row">
      <label for="enable-extension" data-i18n="enableExtension">启用扩展</label>
      <input type="checkbox" id="enable-extension" checked>
    </div>
    <div class="row">
      <label for="inline-enabled" data-i18n="inlineEnabled">页面注音</label>
      <input type="checkbox" id="inline-enabled">
    </div>
    <div class="row">
      <label for="reading-mode" data-i18n="readingMode">读音</label>
      <select id="reading-mode">
        <option value="hiragana" data-i18n="modeHiragana">平假名</option>
        <option value="katakana" data-i18n="modeKatakana">片假名</option>
        <option value="romaji" data-i18n="modeRomaji">Romaji</option>
      </select>
    </div>
  </div>

  <div class="section">
    <div class="row">
      <label for="short-meaning" data-i18n="shortMeaning">词级短译</label>
      <input type="checkbox" id="short-meaning">
    </div>
    <div class="row">
      <label for="sentence-translation" data-i18n="sentenceTranslation">句级译文</label>
      <input type="checkbox" id="sentence-translation">
    </div>
    <div class="row">
      <label for="translate-target" data-i18n="translateTarget">译文语言</label>
      <select id="translate-target">
        <option value="zh-CN" data-i18n="langZh">简体中文</option>
        <option value="en" data-i18n="langEn">English</option>
        <option value="none" data-i18n="langNone">关闭</option>
      </select>
    </div>
    <div class="note" data-i18n="sentenceNote">句译只在你点击句子并确认后发送文本。</div>
  </div>

  <div class="section">
    <div class="row">
      <label for="tts-speed"><span data-i18n="ttsSpeed">朗读速度</span>: <span id="tts-speed-val">1.0</span>x</label>
      <input type="range" id="tts-speed" min="0.1" max="1.5" step="0.1" value="1.0">
    </div>
    <div class="row">
      <label for="theme-select" data-i18n="theme">主题</label>
      <select id="theme-select">
        <option value="system" data-i18n="themeSystem">跟随系统</option>
        <option value="light" data-i18n="themeLight">浅色</option>
        <option value="dark" data-i18n="themeDark">深色</option>
      </select>
    </div>
  </div>

  <div class="section">
    <button id="feedback-btn" class="plain-btn" data-i18n="feedback">反馈建议</button>
    <div class="support-grid">
      <button class="plain-btn support-btn" data-amount="1" data-i18n="coffeeSupport">请我喝杯咖啡 · 1 USD</button>
      <button class="plain-btn support-btn" data-amount="5" data-i18n="mealSupport">请我吃顿美餐 · 5 USD</button>
      <button class="plain-btn support-btn" data-amount="custom" data-i18n="customAmount">随心支持</button>
    </div>
  </div>

  <div class="footer">
    <span id="version-label"></span>
    <a href="https://github.com/pursonc/Fudoki-Reader" target="_blank" class="link">GitHub</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
